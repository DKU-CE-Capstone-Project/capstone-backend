name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: backend
      - uses: actions/checkout@v4
        with:
          repository: DKU-CE-Capstone-Project/capstone-news-logic
          ref: main
          path: news-logic
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install './news-logic[dev]' './backend[dev]'
      - run: python -m pytest -q tests ../news-logic/tests
        working-directory: backend
        env:
          DEMO_MODE: 'true'
          USE_MOCK_NEWS: 'true'
          USE_MONGODB: 'false'
          USE_LLM_SUMMARIES: 'false'
