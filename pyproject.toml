[project]
name = "capstone-backend"
version = "0.1.0"
description = "Real-time news multi-agent investment decision support — backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "google-generativeai>=0.8",
    # 신규 google-genai SDK (llm.py가 `from google import genai` 사용) — 컨테이너 필수
    "google-genai>=1.0",
    # Claude(Anthropic) — 텍스트 생성 우선 제공자 (anthropic_api_key 있을 때)
    "anthropic>=0.49",
    # ── 뉴스 수집 파이프라인 ──────────────────────────────────────────────────
    # GDELT DOC API + 로컬 캐시 (requests는 sync 호출 전용, asyncio.to_thread 사용)
    "requests>=2.32",
    # 뉴스 본문 추출 (DOM 정제)
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    # trafilatura fallback 추출기
    "trafilatura>=1.12",
    # ── CNCF 이벤트 인프라 (api/worker 비동기 분리) ──────────────────────────
    # NATS JetStream 클라이언트 (이벤트 버스 / 큐)
    "nats-py>=2.6",
    # Redis 공유 상태 (멀티팟 job 결과 저장)
    "redis>=5.0",
    # MongoDB Atlas (영속화 + Atlas Vector Search) — pymongo 4.x 동반(벡터 인덱스 API)
    "motor>=3.4",
    # google-adk is intentionally deferred — current orchestrator is a deterministic
    # pipeline. ADK gets pulled in when we add reasoning/branching (SequentialAgent
    # or LlmAgent with tools). Add `google-adk>=0.2` back at that point.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
